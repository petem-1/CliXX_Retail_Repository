---
- name: "Delete DB"
  hosts: localhost
  connection: local
  vars:
    instance_id: wordpressdbclixxjenkins
  tasks:
    - name: Remove DB instance without taking a final snapshot
      amazon.aws.rds_instance:
        id: '{{ instance_id }}'
        state: absent
        skip_final_snapshot: true
        region: us-east-1
